[project]
name = "fastecom"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "alembic>=1.20.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
